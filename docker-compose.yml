x-php-service: &php-service
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  environment:
    DB_HOST: db
    DB_USER: username
    DB_PASSWORD: password
    DB_DATABASE: database
  volumes:
    - ./:/var/www/html

services:
  db:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: database
      MYSQL_USER: username
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP only: MySQL accepts TCP connections after its first-start initialisation has finished.
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_PORT=3306
  assets:
    build:
      context: .
      dockerfile: Dockerfile
      target: assets
    command: ["tailwindcss", "-i", "assets/styles/app.css", "-o", "public/assets/app.css", "--minify"]
    restart: "no"
    volumes:
      - ./:/var/www/html:ro
      - assets:/var/www/html/public/assets
  migrate:
    <<: *php-service
    command: ["php", "bin/migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *php-service
    container_name: app
    volumes:
      - ./:/var/www/html
      - assets:/var/www/html/public/assets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      assets:
        condition: service_completed_successfully
    ports:
      - "8080:80"
volumes:
  mysql_data:
  assets:
